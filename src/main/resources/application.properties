spring.application.name=ExpenseTrack

spring.datasource.url=${EXPENSETRACK_DB_URL:jdbc:mysql://localhost:3306/expensetrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${EXPENSETRACK_DB_USERNAME:root}
spring.datasource.password=${EXPENSETRACK_DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${EXPENSETRACK_JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

expensetrack.jwt.secret=${EXPENSETRACK_JWT_SECRET:change-this-to-a-long-secret-key-1234567890}
expensetrack.jwt.expiration=${EXPENSETRACK_JWT_EXPIRATION:86400000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080
